[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "studydeck"
version = "1.0.0"
description = "中文学习卡片与简明间隔重复 CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "StudyDeck contributors"}]
[project.scripts]
studydeck = "studydeck.app:main"
[tool.setuptools.packages.find]
where = ["src"]
